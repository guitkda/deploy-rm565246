<style>
    :root {
        --fiap-pink: #2563EB;

        --fiap-gray: #F1F5F9;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        background-color: var(--fiap-gray);
        color: var(--fiap-black);
    }

    header {
        background-color: var(--fiap-black);
        color: var(--fiap-white);
        padding: 20px;
        text-align: center;
        border-bottom: 5px solid var(--fiap-pink);
    }

    header h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 2px;
    }

    .container {
        max-width: 800px;
        margin: 30px auto;
        padding: 20px;
        background: var(--fiap-white);
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
    }

        padding: 10px;
        border: 1px solid #CBD5E1;
        border-radius: 4px;

        font-size: 16px;
    }

    input:focus, select:focus {
        border-color: var(--fiap-pink);
        outline: none;
    }

        background-color: var(--fiap-pink);
        color: var(--fiap-white);

        border-radius: 4px;

        width: 100%;

    }

    }

        text-align: left;
        border-bottom: 1px solid #E2E8F0;
    }

    th {
        background-color: var(--fiap-black);
        color: var(--fiap-white);
    }

    tr:hover {
        background-color: #EFF6FF;
    }

    .message {
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 4px;
        display: none;
    }

    .success {
        background-color: #DCFCE7;
        color: #166534;
